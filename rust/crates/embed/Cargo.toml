[package]
name = "embed"
version = "0.1.0"
edition.workspace = true
license.workspace = true

# Embedder implementations:
# - StubEmbedder        deterministic, normalized vectors (test/dev)
# - SidecarEmbedder     spawns Swift `mindforest-embed` (MLX-Swift),
#                       stdio newline-JSON protocol, exponential-backoff restart
# - UnavailableEmbedder reports unavailable; consumers degrade to FTS-only
[dependencies]
async-trait = { workspace = true }
blake3 = { workspace = true }
domain = { path = "../domain" }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true }
tracing = { workspace = true }

[dev-dependencies]
tempfile = { workspace = true }
