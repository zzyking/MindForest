[package]
name = "app-core"
version = "0.1.0"
edition.workspace = true
license.workspace = true

# Composes domain + storage-fs + index-sqlite (and, in P3, embed) into
# ForestService — the surface the HTTP layer (apps/api) talks to.
# Owns the transactional boundary for file + index writes, plus the
# watcher loop that keeps the index in sync against external edits.
[dependencies]
async-trait = { workspace = true }
chrono = { workspace = true }
domain = { path = "../domain" }
index-sqlite = { path = "../index-sqlite" }
storage-fs = { path = "../storage-fs" }
tokio = { workspace = true }
tracing = { workspace = true }

[dev-dependencies]
tempfile = { workspace = true }
