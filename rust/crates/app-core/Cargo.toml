[package]
name = "app-core"
version = "0.1.0"
edition.workspace = true
license.workspace = true

# Composes domain + storage-fs + index-sqlite + embed into ForestService
# — the surface the HTTP layer (apps/api) talks to. Owns the transactional
# boundary for file + index writes, the watcher loop that keeps the index
# in sync against external edits, the embed worker that drains pending
# embedding jobs, and the hybrid search composition (FTS + vec via RRF).
[dependencies]
agent = { path = "../agent" }
async-trait = { workspace = true }
chrono = { workspace = true }
domain = { path = "../domain" }
embed = { path = "../embed" }
futures = { workspace = true }
index-sqlite = { path = "../index-sqlite" }
serde = { workspace = true }
storage-fs = { path = "../storage-fs" }
tokio = { workspace = true }
tracing = { workspace = true }

[dev-dependencies]
tempfile = { workspace = true }
