[package]
name = "desktop"
version = "0.1.0"
edition.workspace = true
license.workspace = true

# Tauri shell. Boots `apps/api`'s axum server in-process on a randomly
# assigned localhost port, injects the resulting base URL into the
# webview via an init script, and serves the Vite/React SPA either from
# the dev server (dev) or `web/dist/` (packaged).
[dependencies]
api = { path = "../api" }
tauri = { version = "2", features = ["devtools"] }
tokio = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }

[build-dependencies]
tauri-build = { version = "2", features = [] }
