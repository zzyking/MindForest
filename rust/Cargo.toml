[workspace]
members = [
  "apps/api",
  "apps/desktop",
  "crates/domain",
  "crates/storage-fs",
  "crates/index-sqlite",
  "crates/embed",
  "crates/app-core",
]
resolver = "2"

[workspace.package]
edition = "2021"
license = "MIT"
authors = ["MindForest"]

# Shared dependency versions. Crates opt-in to specific features per-need.
[workspace.dependencies]
async-trait = "0.1"
axum = { version = "0.7", features = ["macros"] }
blake3 = "1"
chrono = { version = "0.4", features = ["serde"] }
governor = "0.7"
gray_matter = "0.2"
notify = "6"
rusqlite = { version = "0.31", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "1"
tokio = { version = "1", features = ["full"] }
tokio-rusqlite = "0.5"
tower-http = { version = "0.5", features = ["cors", "trace", "fs"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
ulid = { version = "1", features = ["serde"] }
