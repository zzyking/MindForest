[workspace]
members = [
  "apps/api",
  "apps/desktop",
  "crates/domain",
  "crates/storage-fs",
  "crates/index-sqlite",
  "crates/embed",
  "crates/app-core",
]
resolver = "2"

[workspace.package]
edition = "2021"
license = "MIT"
authors = ["MindForest"]

# Shared dependency versions. Crates opt-in to specific features per-need.
[workspace.dependencies]
async-trait = "0.1"
axum = { version = "0.7", features = ["macros"] }
blake3 = "1"
bytemuck = "1.18"
chrono = { version = "0.4", features = ["serde"] }
governor = "0.7"
notify = "6"
notify-debouncer-full = "0.3"
# `bundled` ships SQLite at a known version (avoids divergence with the
# system lib). sqlite-vec registers itself via sqlite3_auto_extension at
# process startup, so we don't need rusqlite's `load_extension` feature.
rusqlite = { version = "0.31", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sqlite-vec = "0.1"
thiserror = "1"
tokio = { version = "1", features = ["full"] }
tokio-rusqlite = "0.5"
serde_yml = "0.0.12"
tempfile = "3"
tower-http = { version = "0.5", features = ["cors", "trace", "fs"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
ulid = { version = "1", features = ["serde"] }
